name: Windows • Бүрэн суулгагч
on:
  push:
    branches: [main, codex/macos-bundled]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  installer:
    runs-on: windows-2022
    env:
      PYTHONUTF8: '1'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Build tools (users do not install these)
        shell: pwsh
        run: |
          choco install tesseract innosetup -y --no-progress
          if ($LASTEXITCODE -notin @(0,3010)) { throw 'Build tools failed' }
      - name: Mongolian installer language
        shell: pwsh
        run: ./scripts/installer_language.ps1
      - name: Bundle model, OCR, runtime; real smoke; build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: ./build.ps1
      - name: Silent install and installed smoke
        shell: pwsh
        run: |
          $p=Start-Process output/BORO-Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/DIR=C:\BORO-Test','/LOG=install.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Silent installer failed' }
          $p=Start-Process C:/BORO-Test/BORO.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Installed smoke failed' }
          $p=Start-Process C:/BORO-Test/unins000.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Uninstall failed' }
      - name: Measure synthetic 30-second target
        shell: pwsh
        run: python scripts/benchmark_quiz.py
      - uses: actions/upload-artifact@v4
        with:
          name: BORO-Windows-Installer
          path: |
            output/*
            benchmark-results.json
          compression-level: 0
          retention-days: 14
      - name: Publish verified build
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag='build-${{ github.run_number }}'
          gh release create $tag output/* --title "BORO Windows $tag" --notes "Бүрэн багц: Python runtime, Tesseract mon+eng, llama.cpp CPU, Qwen3 4B. Бүх файлыг нэг хавтаст татаж BORO-Setup.exe ажиллуулна. Windows automated OCR/AI, frozen app, silent install/uninstall checks passed. Real Teams/manual acceptance and Mongolian law accuracy remain unvalidated."
