name: macOS • Нэмэлт суулгагч
on:
  push:
    branches: [main, codex/macos-bundled]
    paths:
      - '**.py'
      - '.github/workflows/macos.yml'
      - 'requirements*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build dependencies
        run: |
          brew install tesseract dylibbundler
          python -m pip install -r requirements.txt pyobjc-framework-Quartz
      - name: Generate BORO icons
        run: python scripts/make_branding.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Bundle OCR, native libraries and local model
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/prepare_macos.py
      - name: Real macOS OCR and local AI smoke
        run: python app.py --self-test
      - name: Freeze standalone app
        run: python -m PyInstaller --clean --noconfirm --onedir --windowed --osx-bundle-identifier studio.rainy.boro --hidden-import Quartz --icon branding/boro.icns --name BORO app.py
      - name: App-local assets, ad-hoc signing, package
        run: python scripts/package_macos.py
      - name: Install and verify packaged application
        run: |
          sudo installer -pkg output/BORO-${{ matrix.arch }}.pkg -target /
          /Applications/BORO.app/Contents/MacOS/BORO --self-test
          sudo rm -rf /Applications/BORO.app
      - name: Measure synthetic 30-second target
        run: python scripts/benchmark_quiz.py
      - uses: actions/upload-artifact@v4
        with:
          name: BORO-macOS-${{ matrix.arch }}
          path: |
            output/*.pkg
            output/*.command
            output/*SHA256.txt
            benchmark-results.json
          compression-level: 0
          retention-days: 14
      - name: Publish additional macOS download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create mac-${{ matrix.arch }}-${{ github.run_number }} output/*.part* output/*.command output/*SHA256.txt --title 'BORO macOS ${{ matrix.arch }}' --notes 'macOS нэмэлт хувилбар. Windows release хэвээр. .part бүх файл болон Install command файлыг нэг хавтаст татна. Screen Recording зөвшөөрөл шаардлагатай. Ad-hoc signed, Apple notarization хийгдээгүй. Automated OCR/AI/package smoke passed; real Teams screen permission and accuracy need human validation.'
